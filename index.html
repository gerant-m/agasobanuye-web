
<!DOCTYPE html>
<html lang="rw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808">
<meta name="google-site-verification" content="fho2hafgfbxngSSl1E9UtPM4xRp3gDtjN2kWQtMttoA">
<meta name="description" content="KEGAFILMS.NET - Movies & Series in Kinyarwanda">
<title>KEGAFILMS.NET | Movies & Series</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/appwrite@29.0.0"></script>
<style>

:root {
  --red: #e50914;
  --red-dark: #b20710;
  --bg: #080808;
  --surface: #141414;
  --card: #181818;
  --muted: #aaa;
  --line: #292929;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
}

body {
  background: var(--bg);
  color: #fff;
  font-family: Inter, Arial, sans-serif;
  overflow-x: hidden;
}

button, input, select, textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

a {
  color: inherit;
  text-decoration: none;
}

/* HEADER */
header {
  position: sticky;
  top: 0;
  z-index: 50;
  min-height: 76px;
  padding: 13px 5%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 22px;
  background: linear-gradient(180deg, #050505, rgba(8,8,8,.97));
  border-bottom: 1px solid rgba(255,255,255,.07);
  backdrop-filter: blur(18px);
}

.logo {
  font-size: 27px;
  font-weight: 900;
  letter-spacing: -1.5px;
  white-space: nowrap;
}

.logo span,
.red {
  color: var(--red);
}

.header-right,
.auth-buttons,
.user-account {
  display: flex;
  align-items: center;
  gap: 12px;
}

.user-account span {
  max-width: 150px;
  overflow: hidden;
  text-overflow: ellipsis;
  font-size: 12px;
}

.user-account[hidden],
.auth-buttons[hidden] {
  display: none;
}

.search {
  width: min(300px, 28vw);
}

input, select, textarea {
  width: 100%;
  padding: 13px 15px;
  color: white;
  background: #171717;
  border: 1px solid #383838;
  border-radius: 7px;
  outline: none;
}

input:focus, select:focus, textarea:focus {
  border-color: var(--red);
}

.small-btn {
  padding: 11px 17px;
  border: 1px solid #444;
  border-radius: 6px;
  color: white;
  background: #202020;
  font-weight: 800;
  transition: .25s;
}

.small-btn:hover {
  background: #333;
}

.red-btn {
  background: var(--red);
  border-color: var(--red);
}

.red-btn:hover {
  background: var(--red-dark);
}

/* NETFLIX STYLE HERO */
.hero {
  min-height: 650px;
  padding: 100px 6% 75px;
  display: flex;
  align-items: center;
  position: relative;
  background:
    linear-gradient(90deg, #080808 0%, rgba(8,8,8,.88) 28%, rgba(8,8,8,.25) 75%),
    linear-gradient(0deg, #080808 0%, transparent 45%),
    url("agent kim s01.jpg") center 35%/cover no-repeat;
}

.hero-content {
  max-width: 660px;
  position: relative;
  z-index: 1;
}

.eyebrow {
  color: #ff424b;
  font-size: 12px;
  font-weight: 900;
  letter-spacing: 4px;
  text-transform: uppercase;
  margin-bottom: 20px;
}

.hero h1 {
  font-size: clamp(48px, 8vw, 88px);
  line-height: .98;
  font-weight: 900;
  letter-spacing: -4px;
  text-shadow: 0 5px 25px #000;
}

.hero p {
  max-width: 550px;
  color: #ddd;
  font-size: 16px;
  line-height: 1.9;
  margin-top: 25px;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 13px;
  margin-top: 30px;
}

.btn {
  padding: 15px 25px;
  border: 0;
  border-radius: 5px;
  font-weight: 900;
  transition: .25s;
}

.btn:hover {
  transform: translateY(-3px);
}

.primary {
  color: white;
  background: var(--red);
}

.primary:hover {
  background: var(--red-dark);
}

.secondary {
  color: #111;
  background: white;
}

.dark-btn {
  color: white;
  background: #333;
}

.support {
  max-width: 430px;
  padding: 18px;
  margin-top: 35px;
  background: rgba(0,0,0,.65);
  border: 1px solid #444;
  border-radius: 9px;
  backdrop-filter: blur(10px);
}

.support p {
  font-size: 13px;
  margin-top: 7px;
}

/* CONTENT SECTIONS */
section.content {
  padding: 45px 5%;
}

.section-heading {
  font-size: 27px;
  font-weight: 900;
  letter-spacing: -.6px;
  margin-bottom: 23px;
}

/* TRENDING */
.trending {
  display: flex;
  gap: 17px;
  overflow-x: auto;
  padding: 5px 2px 20px;
  scrollbar-width: thin;
  scrollbar-color: #444 transparent;
}

.trend {
  position: relative;
  flex: 0 0 250px;
  height: 145px;
  overflow: hidden;
  border-radius: 9px;
  background: #222;
  cursor: pointer;
  transition: .3s;
}

.trend:hover {
  transform: scale(1.045);
}

.trend img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.trend strong {
  position: absolute;
  inset: auto 0 0;
  padding: 30px 12px 12px;
  font-size: 14px;
  background: linear-gradient(transparent, #000);
}

/* FILTERS */
.filters {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 22px;
}

.filters select {
  background: #171717;
  border: 1px solid #333;
  padding: 13px;
}

.tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
  margin-bottom: 25px;
}

.tab {
  padding: 10px 20px;
  border-radius: 30px;
  border: 1px solid #383838;
  background: #171717;
  color: #ddd;
  font-weight: 700;
  transition: .25s;
}

.tab:hover {
  border-color: var(--red);
}

.tab.active {
  background: var(--red);
  border-color: var(--red);
  color: white;
}

/* MOVIE CARDS */
.movie-grid {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 20px;
}

.movie-card {
  min-width: 0;
  overflow: hidden;
  background: #151515;
  border: 1px solid #292929;
  border-radius: 9px;
  transition: transform .3s, box-shadow .3s;
}

.movie-card:hover {
  transform: translateY(-7px) scale(1.025);
  box-shadow: 0 15px 35px rgba(0,0,0,.55);
  border-color: #555;
}

.poster {
  height: 290px;
  position: relative;
  overflow: hidden;
  background: #222;
}

.poster img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform .45s;
}

.movie-card:hover .poster img {
  transform: scale(1.08);
}

.badge {
  position: absolute;
  left: 10px;
  top: 10px;
  padding: 6px 9px;
  border-radius: 4px;
  background: var(--red);
  font-size: 10px;
  font-weight: 900;
}

.movie-info {
  padding: 14px;
}

.movie-title {
  font-size: 14px;
  font-weight: 900;
  line-height: 1.5;
}

.meta {
  color: #999;
  font-size: 11px;
  margin-top: 9px;
  line-height: 1.8;
}

.card-buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 7px;
  margin-top: 15px;
}

.card-buttons button {
  padding: 10px 5px;
  border: 0;
  border-radius: 5px;
  font-size: 11px;
  font-weight: 900;
  transition: .2s;
}

.card-buttons button:hover {
  filter: brightness(.8);
}

.watch {
  background: var(--red);
  color: white;
}

.download {
  background: #333;
  color: white;
}

.empty {
  display: none;
  padding: 35px;
  text-align: center;
  color: #aaa;
}

/* VIDEO AND SERIES PAGES */
.page {
  display: none;
  min-height: 75vh;
  padding: 40px 5%;
}

.page.active {
  display: block;
}

.player {
  max-width: 1050px;
  margin: auto;
}

.player video {
  width: 100%;
  max-height: 70vh;
  margin: 20px 0;
  background: #000;
  border-radius: 10px;
}

.player h1 {
  font-size: 28px;
  margin: 15px 0;
}

.back {
  margin-bottom: 15px;
}

.episodes {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 13px;
  margin-top: 25px;
}

.episode {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 17px;
  background: #171717;
  border: 1px solid #333;
  border-radius: 8px;
}

.episode button {
  padding: 10px 12px;
  border: 0;
  border-radius: 5px;
  color: white;
  background: var(--red);
}

/* FOOTER */
footer {
  padding: 45px 15px;
  text-align: center;
  background: #050505;
  border-top: 1px solid #292929;
  color: #999;
  line-height: 2.2;
}

footer h2 {
  color: white;
  font-size: 27px;
  font-weight: 900;
}

footer a:hover {
  color: var(--red);
}

.whatsapp {
  position: fixed;
  right: 22px;
  bottom: 22px;
  z-index: 40;
  width: 55px;
  height: 55px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: #25D366;
  color: white;
  font-size: 28px;
  box-shadow: 0 5px 20px #000;
}

/* LOGIN AND SIGNUP */
.overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 100;
  align-items: center;
  justify-content: center;
  padding: 15px;
  background: rgba(0,0,0,.88);
  backdrop-filter: blur(8px);
}

.overlay.open {
  display: flex;
}

.auth-overlay-brand {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
}

.auth-overlay-brand:before {
  content: "";
  position: absolute;
  width: 560px;
  height: 560px;
  right: -180px;
  top: -220px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(229,9,20,.25), transparent 68%);
}

.auth-overlay-brand:after {
  content: "";
  position: absolute;
  width: 440px;
  height: 440px;
  left: -180px;
  bottom: -230px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(229,9,20,.15), transparent 70%);
}

.auth-card {
  position: relative;
  z-index: 1;
  width: min(460px, 100%);
  max-height: 90vh;
  overflow-y: auto;
  padding: 34px 30px;
  border: 1px solid #383838;
  border-radius: 16px;
  background: linear-gradient(145deg, #1d1d1d, #101010);
  box-shadow: 0 25px 90px #000;
}

.auth-card h2 {
  text-align: center;
  margin-bottom: 10px;
}

.auth-brand-mark {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  font-size: 26px;
  font-weight: 900;
  margin-bottom: 20px;
}

.auth-brand-mark span {
  color: var(--red);
}

.auth-welcome-kicker {
  text-align: center;
  color: #ff555d;
  font-size: 10px;
  font-weight: 900;
  letter-spacing: 2px;
  margin-bottom: 12px;
}

.auth-title {
  font-size: 29px;
  letter-spacing: -1px;
}

.auth-subtitle {
  color: #aaa;
  text-align: center;
  font-size: 13px;
  line-height: 1.8;
  margin: 12px 0 25px;
}

.auth-card form {
  display: none;
}

.auth-card form.active {
  display: block;
}

.auth-card form h3 {
  margin-bottom: 15px;
}

.auth-card label {
  display: block;
  margin: 13px 0 7px;
  color: #ddd;
  font-size: 13px;
  font-weight: 700;
}

.auth-card input {
  background: #090909;
  padding: 14px;
}

.submit {
  width: 100%;
  padding: 14px;
  margin-top: 18px;
  border: 0;
  border-radius: 6px;
  color: white;
  background: var(--red);
  font-weight: 900;
}

.submit:hover {
  background: var(--red-dark);
}

.auth-link {
  display: block;
  margin: 13px auto 0;
  padding: 5px;
  border: 0;
  background: transparent;
  color: #bbb;
  font-size: 12px;
}

.auth-link:hover {
  color: white;
}

.close {
  position: absolute;
  right: 15px;
  top: 13px;
  border: 0;
  background: transparent;
  color: white;
  font-size: 22px;
}

.message {
  display: none;
  margin-top: 15px;
  padding: 12px;
  border-radius: 6px;
  background: #292929;
  color: #eee;
  font-size: 13px;
  line-height: 1.6;
}

.message.show {
  display: block;
}

/* ADMIN DASHBOARD */
.admin-panel {
  display: none;
  padding: 35px 4%;
  min-height: calc(100vh - 70px);
  background: #080808;
}

.admin-panel.open {
  display: block;
}

body.admin-mode #homePage,
body.admin-mode .page,
body.admin-mode footer,
body.admin-mode .whatsapp {
  display: none !important;
}

body.admin-mode #adminPanel.open {
  display: block !important;
}

.admin-topbar {
  max-width: 1500px;
  margin: 0 auto 28px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
}

.admin-topbar h1 {
  font-size: clamp(25px, 4vw, 36px);
  margin-top: 7px;
}

.admin-kicker {
  color: var(--red);
  font-size: 10px;
  font-weight: 900;
  letter-spacing: 2.5px;
}

.admin-identity {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 12px 16px;
  background: #151515;
  border: 1px solid #333;
  border-radius: 30px;
  color: #ddd;
  font-size: 12px;
}

.admin-live-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #25c66b;
  box-shadow: 0 0 12px #25c66b;
}

.admin-layout {
  max-width: 1500px;
  margin: auto;
  display: grid;
  grid-template-columns: 225px minmax(0, 1fr);
  gap: 24px;
}

.admin-sidebar {
  position: sticky;
  top: 90px;
  height: max-content;
  padding: 12px;
  background: #111;
  border: 1px solid #292929;
  border-radius: 12px;
}

.admin-nav {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 12px;
  margin: 3px 0;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: #aaa;
  text-align: left;
  font-weight: 700;
}

.admin-nav:hover,
.admin-nav.active {
  background: #2b1719;
  color: white;
}

.admin-nav.active i {
  color: var(--red);
}

.admin-sidebar-note {
  display: flex;
  gap: 9px;
  padding: 15px 8px 5px;
  margin-top: 18px;
  border-top: 1px solid #292929;
  color: #888;
  font-size: 11px;
  line-height: 1.6;
}

.admin-sidebar-note i {
  color: var(--red);
}

.admin-main {
  min-width: 0;
}

.admin-view {
  display: none;
}

.admin-view.active {
  display: block;
}

.admin-welcome {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: 30px;
  margin-bottom: 22px;
  border: 1px solid #492326;
  border-radius: 13px;
  background:
    radial-gradient(circle at 85% 20%, rgba(229,9,20,.22), transparent 35%),
    linear-gradient(120deg, #211315, #111);
}

.admin-welcome h2 {
  font-size: clamp(22px, 3vw, 31px);
  margin: 10px 0;
}

.admin-welcome p,
.admin-section-head p {
  color: #aaa;
  font-size: 12px;
}

.admin-welcome > i {
  font-size: 55px;
  color: var(--red);
}

.admin-stats {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 13px;
  margin-bottom: 30px;
}

.admin-stat {
  display: flex;
  flex-direction: column;
  gap: 9px;
  padding: 19px;
  background: #151515;
  border: 1px solid #292929;
  border-radius: 11px;
}

.admin-stat span {
  color: #aaa;
  font-size: 12px;
}

.admin-stat strong {
  font-size: 30px;
}

.admin-stat small {
  color: #777;
  font-size: 10px;
}

.admin-stat .stat-online {
  color: #39d98a;
  font-size: 20px;
}

.admin-section-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin: 25px 0 14px;
}

.admin-section-head h2 {
  font-size: 19px;
  margin-bottom: 5px;
}

.admin-quick-actions {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.admin-quick {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 19px;
  border: 1px solid #292929;
  border-radius: 10px;
  background: #151515;
  color: white;
  text-align: left;
}

.admin-quick > i:first-child {
  width: 43px;
  height: 43px;
  display: grid;
  place-items: center;
  border-radius: 9px;
  background: #321719;
  color: #ff3340;
}

.admin-quick span {
  display: flex;
  flex-direction: column;
  gap: 6px;
  flex: 1;
}

.admin-quick small {
  color: #999;
  font-size: 11px;
}

.admin-quick > i:last-child {
  color: #777;
}

.admin-text-btn {
  border: 0;
  background: transparent;
  color: #ff4650;
  font-size: 12px;
  font-weight: 800;
}

.admin-recent,
.admin-library-list {
  display: grid;
  gap: 10px;
}

.admin-recent-item,
.admin-library-item {
  display: flex;
  align-items: center;
  gap: 13px;
  min-width: 0;
  padding: 12px;
  background: #151515;
  border: 1px solid #292929;
  border-radius: 9px;
}

.admin-thumb {
  width: 55px;
  height: 68px;
  flex-shrink: 0;
  object-fit: cover;
  border-radius: 5px;
  background: #292929;
}

.admin-item-info {
  flex: 1;
  min-width: 0;
}

.admin-item-info b {
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 13px;
}

.admin-item-info small {
  display: block;
  color: #999;
  font-size: 11px;
  margin-top: 6px;
}

.admin-pill {
  padding: 6px 9px;
  border-radius: 20px;
  background: #351719;
  color: #ff626a;
  font-size: 9px;
  font-weight: 900;
}

.admin-form-card {
  padding: 23px;
  background: #151515;
  border: 1px solid #303030;
  border-radius: 12px;
}

.admin-form-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px 15px;
}

.admin-form-card label {
  display: block;
  margin: 11px 0 7px;
  color: #ccc;
  font-size: 12px;
}

.admin-form-card input,
.admin-form-card select,
.admin-form-card textarea,
.admin-library-tools input,
.admin-library-tools select {
  background: #090909;
  border: 1px solid #383838;
}

.admin-form-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 8px;
}

.admin-form-actions .btn {
  display: flex;
  align-items: center;
  gap: 8px;
}

.admin-library-tools {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 180px;
  gap: 10px;
  margin-bottom: 15px;
}

.admin-item-actions {
  display: flex;
  gap: 7px;
}

.admin-icon-btn {
  padding: 10px;
  border: 1px solid #383838;
  border-radius: 6px;
  background: #202020;
  color: #ddd;
}

.admin-icon-btn.delete {
  color: #ff626a;
}

.admin-empty {
  padding: 30px;
  border: 1px dashed #383838;
  border-radius: 10px;
  background: #141414;
  color: #888;
  text-align: center;
  font-size: 13px;
}

.admin-panel .hint {
  color: #999;
  font-size: 12px;
  line-height: 1.7;
  margin: 10px 0;
}

#adminMessage {
  display: block;
  min-height: 18px;
  margin: 10px 0 18px;
  color: #ff737b;
  font-size: 13px;
  line-height: 1.6;
}

/* RESPONSIVE DESIGN */
@media(max-width: 1100px) {
  .movie-grid {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .poster {
    height: 260px;
  }
}

<script>
/* ===================== APPWRITE SETTINGS =====================
   Project ID, Endpoint, Bucket ID na Team ID watanze byashyizwemo.
   Uzuza DATABASE_ID nyuma yo kuyikura muri Appwrite Console.
   Table ID: movies (igomba kuba ihuye n'iyo wakoze muri TablesDB).
*/
const APPWRITE_ENDPOINT = "https://nyc.cloud.appwrite.io/v1";
const APPWRITE_PROJECT_ID = "6ae47cb4002bf495d6c9"; const APPWRITE_DATABASE_ID = "6af6c89a00387406ce15";
	
const APPWRITE_TABLE_ID = "6afb19bc00050a8219b4";
	
const APPWRITE_BUCKET_ID = "6af6ca46002c4ae55632";
const APPWRITE_ADMIN_TEAM_NAME = "KEGAFILMS_ADMINS";
let APPWRITE_ADMIN_TEAM_ID = ""; // Iboneka muri Appwrite Team membership ya konti yinjiye.

const {Client, Account, TablesDB, Storage, Teams, ID, Query, Permission, Role} = Appwrite;
const client = new Client().setEndpoint(APPWRITE_ENDPOINT).setProject(APPWRITE_PROJECT_ID);
const account = new Account(client);
const tables = new TablesDB(client);
const storage = new Storage(client);
const teams = new Teams(client);

const localMovies = [
 {title:"ALPHA A",type:"movie",file:"ALPHA_A.mp4",img:"ALPHA.jpg",year:2026,genre:"Action",interpreter:"Rocky"},
 {title:"ALPHA B",type:"movie",file:"ALPHA_B.mp4",img:"ALPHA.jpg",year:2026,genre:"Action",interpreter:"Perfect"},
 {title:"DC DEVADAS CHANDRA",type:"movie",file:"DC_DEVADAS_CHANDRA.mp4",img:"DC_DEVADAS_CHANDRA.jpg",year:2026,genre:"Action",interpreter:"Perfect"},
 {title:"JUST PLAY DEAD",type:"movie",file:"just play dead.mp4",img:"just_play_dead.jpg",year:2026,genre:"Horror",interpreter:"Perfect"},
 {title:"THE RUNNER",type:"movie",file:"The runner.mp4",img:"The runner.jpg",year:2023,genre:"Comedy",interpreter:"Siniya"},
 {title:"AGENT KIM S01",type:"series",img:"agent kim s01.jpg",year:2026,genre:"Series",interpreter:"Rocky",episodes:["agent-kim-ep1.mp4","agent-kim-ep4.mp4","agent-kim-ep5.mp4","agent-kim-ep6.mp4","agent-kim-ep7.mp4","agent-kim-ep8.mp4","agent-kim-ep9.mp4","agent-kim-ep10 FINAL.mp4"]},
 {title:"OUTER BANKS",type:"series",img:"outer banks.jpg",year:2026,genre:"Series",interpreter:"Rocky",episodes:["outer-banks-ep1.mp4","outer-banks-ep2.mp4","outer-banks-ep3.mp4","outer-banks-ep4.mp4","outer-banks-ep5.mp4"]}
];
let movies=[...localMovies],currentCategory="all",currentSeries=null,currentUser=null,isAdmin=false,editingRowId=null,adminAccessError="";
const $=id=>document.getElementById(id);
const movieGrid=$("movieGrid"),emptyMessage=$("emptyMessage");
const searchInput=$("searchInput"),yearFilter=$("yearFilter"),genreFilter=$("genreFilter"),interpreterFilter=$("interpreterFilter"),sortFilter=$("sortFilter");
function escapeHTML(value){return String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function filePath(file){return encodeURI(file)}
function storageView(fileId){return String(storage.getFileView({bucketId:APPWRITE_BUCKET_ID,fileId}))}
function storageDownload(fileId){return String(storage.getFileDownload({bucketId:APPWRITE_BUCKET_ID,fileId}))}
function rowToMovie(row){
 let episodes=[];try{episodes=Array.isArray(row.episodes)?row.episodes:JSON.parse(row.episodes||"[]")}catch{}
 return {...row,id:row.$id,file:row.file||"",img:row.poster||"",episodes,
  _cloud:true,videoUrl:row.file?storageView(row.file):"",posterUrl:row.poster?storageView(row.poster):""};
}
async function loadCloudMovies(){
 if(APPWRITE_DATABASE_ID==="PASTE_DATABASE_ID_HERE")return;
 try{
  const result=await tables.listRows({databaseId:APPWRITE_DATABASE_ID,tableId:APPWRITE_TABLE_ID,queries:[Query.limit(100)]});
  const cloud=result.rows.map(rowToMovie);
  if(cloud.length)movies=cloud;
 }catch(error){console.error("Appwrite Movies:",error);showAdminMessage("Appwrite ntirasomye movies. Reba Database ID, Table ID n'uko columns zimeze.");}
}
function imageFor(movie){return movie.posterUrl||filePath(movie.img||"")}
function videoFor(movie){return movie.videoUrl||filePath(movie.file||"")}
function displayMovies(list){
 movieGrid.innerHTML="";emptyMessage.style.display=list.length?"none":"block";
 list.forEach(movie=>{
  const card=document.createElement("article");card.className="movie-card";
  const action=movie.type==="series"?`<button class="watch" data-action="series" data-id="${escapeHTML(movie.id||"")}" data-title="${escapeHTML(movie.title)}">Episodes</button>`:`<button class="watch" data-action="watch" data-title="${escapeHTML(movie.title)}">▶ Watch</button>`;
  const download=movie.type==="movie"?`<button class="download" data-action="download" data-title="${escapeHTML(movie.title)}" data-id="${escapeHTML(movie.id||"")}">↓ Download</button>`:`<button class="download" data-action="series" data-title="${escapeHTML(movie.title)}">Episodes</button>`;
  card.innerHTML=`<div class="poster"><img src="${escapeHTML(imageFor(movie))}" alt="${escapeHTML(movie.title)}" loading="lazy" onerror="this.style.display='none'"><span class="badge">${movie.type==="series"?"SERIES":"MOVIE"}</span></div><div class="movie-info"><div class="movie-title">${escapeHTML(movie.title)}</div><div class="meta">${escapeHTML(movie.year)} • ${escapeHTML(movie.genre)} • ${escapeHTML(movie.interpreter)}</div><div class="card-buttons">${action}${download}</div></div>`;
  movieGrid.appendChild(card);
 });
}
function displayTrending(){
 const container=$("trendingList");container.innerHTML="";
 movies.forEach(movie=>{const card=document.createElement("div");card.className="trend";card.innerHTML=`<img src="${escapeHTML(imageFor(movie))}" alt="${escapeHTML(movie.title)}" onerror="this.style.display='none'"><strong>${escapeHTML(movie.title)}</strong>`;card.onclick=()=>movie.type==="series"?openSeriesByTitle(movie.title):openMovieByTitle(movie.title);container.appendChild(card)});
}
function createFilters(){
 yearFilter.innerHTML='<option value="">All Years</option>';genreFilter.innerHTML='<option value="">All Genres</option>';interpreterFilter.innerHTML='<option value="">All Interpreters</option>';
 [...new Set(movies.map(m=>m.year))].sort((a,b)=>b-a).forEach(v=>yearFilter.add(new Option(v,v)));
 [...new Set(movies.map(m=>m.genre))].sort().forEach(v=>genreFilter.add(new Option(v,v)));
 [...new Set(movies.map(m=>m.interpreter))].sort().forEach(v=>interpreterFilter.add(new Option(v,v)));
}
function applyFilters(){
 let result=[...movies],search=searchInput.value.trim().toLowerCase();
 if(currentCategory!=="all")result=result.filter(m=>m.type===currentCategory);
 if(search)result=result.filter(m=>m.title.toLowerCase().includes(search));
 if(yearFilter.value)result=result.filter(m=>String(m.year)===yearFilter.value);
 if(genreFilter.value)result=result.filter(m=>m.genre===genreFilter.value);
 if(interpreterFilter.value)result=result.filter(m=>m.interpreter===interpreterFilter.value);
 if(sortFilter.value==="oldest")result.sort((a,b)=>a.year-b.year);else if(sortFilter.value==="az")result.sort((a,b)=>a.title.localeCompare(b.title));else result.sort((a,b)=>b.year-a.year);
 displayMovies(result);
}
function refreshPage(){createFilters();displayTrending();applyFilters()}
function setCategory(category,button){currentCategory=category;document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));button.classList.add("active");applyFilters()}
function resetFilters(){currentCategory="all";yearFilter.value="";genreFilter.value="";interpreterFilter.value="";sortFilter.value="newest";searchInput.value="";document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));$("tabAll").classList.add("active");applyFilters()}
function findMovie(title){return movies.find(m=>m.title===title)}
function hideAllPages(){$("homePage").style.display="none";document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"))}
function openMovieByTitle(title){const movie=findMovie(title);if(movie)openMovie(movie)}
function openMovie(movie){hideAllPages();$("watchPage").classList.add("active");const video=$("mainVideo");video.pause();video.src=videoFor(movie);video.load();$("watchTitle").textContent=movie.title;$("watchMeta").textContent=`${movie.year} • ${movie.genre} • ${movie.interpreter}`;$("watchDownloadButton").onclick=()=>downloadMovie(movie);window.scrollTo({top:0,behavior:"smooth"})}
function openSeriesByTitle(title){const series=findMovie(title);if(!series)return;currentSeries=series;hideAllPages();$("seriesPage").classList.add("active");$("seriesTitle").textContent=series.title;$("seriesMeta").textContent=`${series.year} • ${series.genre} • ${series.interpreter}`;const list=$("episodeList");list.innerHTML="";(series.episodes||[]).forEach((episode,index)=>{const ep=typeof episode==="string"?{file:episode}:episode;const item=document.createElement("div");item.className="episode";item.innerHTML=`<h3>Episode ${index+1}</h3><button data-episode="${index}">▶ Watch</button><button data-episode-download="${index}">↓ Download</button>`;list.appendChild(item)});window.scrollTo({top:0,behavior:"smooth"})}
function playEpisode(index){if(!currentSeries)return;const ep=currentSeries.episodes[index];const file=typeof ep==="string"?ep:ep.file;const url=ep.fileId?storageView(ep.fileId):filePath(file);hideAllPages();$("episodePage").classList.add("active");const video=$("episodeVideo");video.pause();video.src=url;video.load();$("episodeTitle").textContent=`${currentSeries.title} - Episode ${index+1}`;$("episodeDownloadButton").onclick=()=>downloadUrl(url,`${currentSeries.title} Episode ${index+1}`);window.scrollTo({top:0,behavior:"smooth"})}
async function downloadUrl(url,title){try{const a=document.createElement("a");a.href=url;a.download=title.replace(/[^\w\s-]/g,"").replace(/\s+/g,"_")+".mp4";a.target="_blank";document.body.appendChild(a);a.click();a.remove()}catch(e){window.open(url,"_blank","noopener")}}
async function downloadMovie(movie){const url=movie.file?filePath(movie.file):movie.fileId?storageDownload(movie.fileId):"";if(url)downloadUrl(url,movie.title)}
function backToMovies(){$("mainVideo").pause();$("episodeVideo").pause();document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));$("homePage").style.display="block";$("moviesSection").scrollIntoView({behavior:"smooth"})}
function backToSeries(){$("episodeVideo").pause();$("episodePage").classList.remove("active");$("seriesPage").classList.add("active")}
function goHome(){
 if(currentUser&&isAdmin){showAdminView("overview");return}
 document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
 $("homePage").style.display="block";window.scrollTo({top:0,behavior:"smooth"})
}

function showMobileMoney(){alert("Support KEGAFILMS\nMTN MoMo: 0794186614\nMurakoze ku nkunga yanyu!")}
function showAuthMessage(message){const el=$("authMessage");el.textContent=message;el.classList.add("show")}
function openAuth(form="signup"){$("authOverlay").classList.add("open");showAuthForm(form)}
function closeAuth(){$("authOverlay").classList.remove("open")}
function showAuthForm(form){document.querySelectorAll(".auth-card form").forEach(f=>f.classList.remove("active"));$(form==="signup"?"signupForm":form==="login"?"loginForm":form).classList.add("active");$("authMessage").classList.remove("show");$("authMessage").textContent=""}
function showAdminMessage(message){$("adminMessage").textContent=message}
function setPageForRole(){
 const adminMode=Boolean(currentUser&&isAdmin&&APPWRITE_ADMIN_TEAM_ID);
 document.body.classList.toggle("admin-mode",adminMode);
 $("adminPanel").classList.toggle("open",adminMode);
 if(adminMode){
  $("homePage").style.display="none";
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  $("mainVideo").pause();$("episodeVideo").pause();
  $("adminIdentity").textContent=currentUser.email||"Admin account";
  renderAdminDashboard();
  window.scrollTo({top:0,behavior:"smooth"});
 }else{
  $("homePage").style.display="block";
  $("adminPanel").classList.remove("open");
 }
}
async function updateAuthUI(){
 try{
  currentUser=await account.get();
  $("authButtons").hidden=true;
  $("userAccount").hidden=false;
  $("userEmail").textContent=currentUser.email;
  await checkAdminAccess();
 }catch{
  currentUser=null;isAdmin=false;
  $("authButtons").hidden=false;
  $("userAccount").hidden=true;
  setPageForRole();
 }
}
async function checkAdminAccess(){
 isAdmin=false;
 APPWRITE_ADMIN_TEAM_ID="";
 adminAccessError="";
 if(currentUser){
  try{
   // Team ID ntabwo tuyikeka: tuyibona muri teams user ari member.
   const result=await teams.list();
   const memberships=Array.isArray(result.teams)?result.teams:[];
   const adminTeam=memberships.find(t=>["KEGAFILMS_ADMINS","KEGAFILMS ADMIN","KEGAFILMS ADMINS"].includes(String(t.name||"").trim().toUpperCase().replace(/[_-]+/g," ").replace(/\s+/g," ")) || String(t.name||"").trim().toUpperCase()==="KEGAFILMS_ADMINS");
   if(adminTeam){
    APPWRITE_ADMIN_TEAM_ID=adminTeam.$id;
    isAdmin=true;
   }else{
    adminAccessError=`Konti yinjiye (${currentUser.email}) ntiri muri Appwrite Team yitwa ${APPWRITE_ADMIN_TEAM_NAME}. Ongeramo iyi email muri Team Members, hanyuma wongere winjire.`;
   }
  }catch(e){
   adminAccessError="Appwrite ntiyashoboye kugenzura Team membership: "+(e.message||"Reba Appwrite Teams permissions / Project ID.");
   console.error("Admin team check:",e);
  }
 }
 setPageForRole();
 if(currentUser&&!isAdmin)showAdminMessage(adminAccessError);
 if(isAdmin){
  try{await loadCloudMovies();refreshPage();renderAdminDashboard();renderAdminLibrary();}
  catch(e){showAdminMessage("Admin yinjiye ariko gusoma catalogue byanze: "+(e.message||"Reba Database/Table permissions."));}
 }
}
async function logoutUser(){
 try{
  await account.deleteSession({sessionId:"current"});
  currentUser=null;isAdmin=false;
  $("authButtons").hidden=false;$("userAccount").hidden=true;
  $("userEmail").textContent="";
  setPageForRole();
  closeAuth();
 }catch(e){showAuthMessage(e.message)}
}

function showAdminView(view){
 if(!currentUser||!isAdmin||!APPWRITE_ADMIN_TEAM_ID){setPageForRole();return}
 const ids={overview:"adminOverview",add:"adminAdd",library:"adminLibrary"};
 document.querySelectorAll(".admin-view").forEach(v=>v.classList.remove("active"));
 document.querySelectorAll(".admin-nav").forEach(v=>v.classList.toggle("active",v.dataset.adminView===view));
 if(ids[view])$(ids[view]).classList.add("active");
 if(view==="library")renderAdminLibrary();
 if(view==="overview")renderAdminDashboard();
}

function adminMovieMarkup(movie,index){
 const title=escapeHTML(movie.title||"Untitled");
 const poster=escapeHTML(imageFor(movie)||"");
 const meta=[movie.year,movie.genre,movie.interpreter].filter(Boolean).map(escapeHTML).join(" • ");
 const type=movie.type==="series"?"SERIES":"MOVIE";
 const rowId=escapeHTML(movie.id||"");
 return `<article class="admin-library-item">
  <img class="admin-thumb" src="${poster}" alt="" onerror="this.style.opacity='.2'">
  <div class="admin-item-info"><b>${title}</b><small>${type} ${meta?"• "+meta:""}</small></div>
  <span class="admin-pill">${type}</span>
  ${rowId?`<div class="admin-item-actions"><button class="admin-icon-btn" data-edit-row="${rowId}" title="Edit"><i class="fa-solid fa-pen"></i></button><button class="admin-icon-btn delete" data-delete-row="${rowId}" title="Delete"><i class="fa-solid fa-trash"></i></button></div>`:""}
 </article>`;
}
function renderAdminDashboard(){
 const cloud=movies.filter(m=>m._cloud);
 const source=cloud.length?cloud:movies;
 $("statTotal").textContent=source.length;
 $("statMovies").textContent=source.filter(m=>m.type==="movie").length;
 $("statSeries").textContent=source.filter(m=>m.type==="series").length;
 const recent=[...source].slice(-5).reverse();
 $("adminRecent").innerHTML=recent.length?recent.map(m=>`<div class="admin-recent-item"><img class="admin-thumb" src="${escapeHTML(imageFor(m))}" alt="" onerror="this.style.opacity='.2'"><div class="admin-item-info"><b>${escapeHTML(m.title)}</b><small>${escapeHTML(m.type)} • ${escapeHTML(m.year||"")}</small></div></div>`).join(""):'<div class="admin-empty">Nta content iraboneka.</div>';
}
function renderAdminLibrary(){
 const q=$("adminSearch").value.trim().toLowerCase(),type=$("adminTypeFilter").value;
 const list=movies.filter(m=>(!type||m.type===type)&&(!q||[m.title,m.genre,m.interpreter].some(v=>String(v||"").toLowerCase().includes(q))));
 $("adminLibraryList").innerHTML=list.length?list.map(adminMovieMarkup).join(""):'<div class="admin-empty">Nta film cyangwa series bihuye n’ishakisha.</div>';
}
$("adminLibraryList").addEventListener("click",async e=>{
 if(!currentUser||!isAdmin||!APPWRITE_ADMIN_TEAM_ID){showAdminMessage("Ntabwo ufite uburenganzira bwa admin.");return}
 const edit=e.target.closest("[data-edit-row]"),del=e.target.closest("[data-delete-row]");
 if(edit){
  const movie=movies.find(m=>m.id===edit.dataset.editRow);if(!movie)return;
  editingRowId=movie.id;
  $("admTitle").value=movie.title||"";$("admType").value=movie.type||"movie";
  $("admYear").value=movie.year||"";$("admGenre").value=movie.genre||"";
  $("admInterpreter").value=movie.interpreter||"";$("admDescription").value=movie.description||"";
  $("admPoster").required=false;$("admVideo").required=false;$("admEpisodes").required=false;
  $("adminVideoField").hidden=movie.type==="series";$("adminEpisodesField").hidden=movie.type!=="series";
  $("adminFormHeading").textContent="Edit content";$("saveMovieBtn").innerHTML='<i class="fa-solid fa-floppy-disk"></i> Save changes';
  showAdminView("add");showAdminMessage("Editing existing content. Leave file fields empty to keep current uploads.");
 }
 if(del){
  const movie=movies.find(m=>m.id===del.dataset.deleteRow);if(!movie)return;
  if(!confirm(`Delete "${movie.title}" from KEGAFILMS?`))return;
  try{
   await tables.deleteRow({databaseId:APPWRITE_DATABASE_ID,tableId:APPWRITE_TABLE_ID,rowId:movie.id});
   movies=movies.filter(m=>m.id!==movie.id);refreshPage();renderAdminDashboard();renderAdminLibrary();
   showAdminMessage("Content deleted from the catalogue.");
  }catch(err){showAdminMessage("Delete failed: "+(err.message||"Check Appwrite row permissions."));}
 }
});
function renderAdminDashboardAndLibrary(){renderAdminDashboard();renderAdminLibrary();}

async function uploadToStorage(file){
 if(!currentUser||!isAdmin||!APPWRITE_ADMIN_TEAM_ID)throw new Error("Admin Team ntiyemejwe. Ongera winjire nyuma yo kongerwa muri KEGAFILMS_ADMINS.");
 if(file.size>50*1024*1024)throw new Error("Iyi file irengeje 50 MB. Appwrite Free Plan ntishobora kuyakira. Hitamo file ntoya cyangwa tuzashyireho ubundi buryo bwo kubika videos nini.");
 const result=await storage.createFile({bucketId:APPWRITE_BUCKET_ID,fileId:ID.unique(),file,permissions:[Permission.read(Role.any()),Permission.update(Role.team(APPWRITE_ADMIN_TEAM_ID)),Permission.delete(Role.team(APPWRITE_ADMIN_TEAM_ID))]});
 return result.$id;
}
$("movieForm").addEventListener("submit",async e=>{
 e.preventDefault();
 if(!currentUser||!isAdmin){showAdminMessage("Ntabwo ufite uburenganzira bwa admin.");return}
 const btn=$("saveMovieBtn");
 btn.disabled=true;btn.textContent=editingRowId?"Saving...":"Uploading...";
 try{
  const title=$("admTitle").value.trim(),type=$("admType").value;
  const posterFile=$("admPoster").files[0],videoFile=$("admVideo").files[0],episodeFiles=[...$("admEpisodes").files];
  if(!editingRowId&&!posterFile)throw new Error("Hitamo poster image.");
  if(type==="movie"&&!editingRowId&&!videoFile)throw new Error("Hitamo video ya movie.");
  if(type==="series"&&!editingRowId&&!episodeFiles.length)throw new Error("Hitamo nibura episode imwe.");
  const existing=editingRowId?movies.find(m=>m.id===editingRowId):null;
  const posterId=posterFile?await uploadToStorage(posterFile):(existing?.poster||existing?.img||"");
  let videoId=existing?.file||existing?.fileId||"";
  if(type==="movie"&&videoFile)videoId=await uploadToStorage(videoFile);
  if(type==="series")videoId="";
  let episodes=existing?.episodes||[];
  if(type==="series"&&episodeFiles.length){
   const episodeIds=[];for(const f of episodeFiles)episodeIds.push(await uploadToStorage(f));
   episodes=episodeIds.map(id=>({fileId:id}));
  }
  const data={title,type,file:videoId,poster:posterId,year:Number($("admYear").value),genre:$("admGenre").value.trim(),interpreter:$("admInterpreter").value.trim(),description:$("admDescription").value.trim(),isFeatured:false,episodes:JSON.stringify(episodes)};
  if(editingRowId){
   await tables.updateRow({databaseId:APPWRITE_DATABASE_ID,tableId:APPWRITE_TABLE_ID,rowId:editingRowId,data});
   showAdminMessage("Content updated successfully.");
  }else{
   await tables.createRow({databaseId:APPWRITE_DATABASE_ID,tableId:APPWRITE_TABLE_ID,rowId:ID.unique(),data,permissions:[Permission.read(Role.any()),Permission.update(Role.team(APPWRITE_ADMIN_TEAM_ID)),Permission.delete(Role.team(APPWRITE_ADMIN_TEAM_ID))]});
   showAdminMessage("Movie/Series published successfully.");
  }
  editingRowId=null;$("admPoster").required=true;
  e.target.reset();
  await loadCloudMovies();refreshPage();renderAdminDashboard();renderAdminLibrary();
 }catch(err){console.error(err);showAdminMessage("Byanze: "+(err.message||"Reba Appwrite Table columns, Bucket permissions na Team access."))}
 finally{btn.disabled=false;btn.innerHTML='<i class="fa-solid fa-cloud-arrow-up"></i> Upload & Publish';}
});
async function init(){
 refreshPage();
 try{await updateAuthUI()}catch(e){console.warn(e)}
 if(!currentUser){await loadCloudMovies();refreshPage();}
 if(!currentUser){openAuth("signup");}
 const params=new URLSearchParams(location.search);
 const userId=params.get("userId"),secret=params.get("secret"),mode=params.get("mode");
 // Appwrite verification and recovery both return userId + secret.
 // The explicit mode prevents a password-reset token being sent to updateVerification.
 if(userId&&secret&&mode==="recovery"){
   openAuth("resetForm");
   showAuthMessage("Shyiramo password nshya kugira ngo urangize kuyihindura.");
 }else if(userId&&secret&&mode==="verification"){
   try{await account.updateVerification({userId,secret});history.replaceState({},document.title,location.pathname);openAuth("login");showAuthMessage("Email yawe yemejwe neza. Ushobora kwinjira.");}
   catch(error){openAuth("login");showAuthMessage("Kwemeza email byanze. Saba indi verification link: "+error.message);}
 }else if(params.has("recovery")||params.has("reset")){
   openAuth("resetForm");
 }
}
init();
</script>
